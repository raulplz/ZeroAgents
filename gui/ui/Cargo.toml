[package]
name = "zeroagents-ui"
description = "Frontend Leptos (CSR) de la app de escritorio de ZeroAgents."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
leptos = { version = "0.8.23", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "CssStyleDeclaration", "KeyboardEvent"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
# Sin `native`: solo modelo, formato y tipos compartidos.
zeroagents-core = { path = "../core", default-features = false }
