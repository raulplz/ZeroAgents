[package]
name = "zeroagents-gui"
description = "ZeroAgents: app de escritorio (Tauri 2) para vigilar agentes de Claude Code."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "zeroagents-gui"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroagents-core = { path = "../core" }
