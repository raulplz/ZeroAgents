[project]
name = "zeroagents"
version = "0.3.0"
description = "Panel Frost para vigilar agentes de IA (Claude Code de momento): uso, modelo, esfuerzo, modo y si te necesitan."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=1.0"]

[project.urls]
Repository = "https://github.com/raulplz/ZeroAgents"

[project.scripts]
zeroagents = "zeroagents.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeroagents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
